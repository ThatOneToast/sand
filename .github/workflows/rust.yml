name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up compiler object cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Do not cache target/. Previous whole-target entries reached multiple
      # GiB per lockfile and exhausted both the repository cache quota and
      # runner disk. sccache stores reusable compiler objects through GitHub's
      # bounded cache backend without archiving the workspace artifact tree.

      - name: Check available disk space
        run: df -h /

      - name: Resolve verified codegen target
        id: codegen-versions
        shell: bash
        run: |
          latest="$(cargo run --quiet -p sand-version --bin codegen-ci-version)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Cache verified Minecraft data
        uses: actions/cache@v4
        with:
          path: ~/.sand/cache
          key: ${{ runner.os }}-sand-minecraft-${{ steps.codegen-versions.outputs.latest }}
          restore-keys: |
            ${{ runner.os }}-sand-minecraft-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Vanilla harness orchestration tests
        run: |
          bash -n scripts/validate-vanilla-reload.sh
          python3 -m unittest scripts.tests.test_vanilla_reload_harness

      - name: Generated API health (latest verified ${{ steps.codegen-versions.outputs.latest }})
        env:
          SAND_MC_VERSION: ${{ steps.codegen-versions.outputs.latest }}
          SAND_STRICT_CODEGEN: "1"
        run: cargo test -p sand-core generated_api_health --lib

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --all-features --verbose

      - name: Rustdoc
        run: cargo doc --workspace --all-features --no-deps
