name: Vanilla reload

on:
  pull_request:
    paths:
      - ".github/workflows/vanilla-reload.yml"
      - "examples/book_project/**"
      - "examples/participant_audit/**"
      - "examples/unified_state/**"
      - "scripts/mc_validation/run_unified_state_audit.py"
      - "scripts/mc_validation/test_unified_state_audit.py"
      - "scripts/mc_validation/local_rcon_server.py"
      - "scripts/mc_validation/rcon_client.py"
      - "sand-cli/**"
      - "sand-core/src/**"
      - "sand-macros/src/**"
      - "sand/src/**"
      - "sand-commands/src/**"
      - "sand-components/src/**"
      - "sand-build/src/codegen/**"
      - "sand-vanilla-audit/**"
      - "scripts/bench_runtime.py"
      - "scripts/validate_worldbuild_profiles.py"
      - "scripts/validate_world_gameplay.py"
      - "scripts/validate_player_observations.py"
      - "scripts/validate_bounded_state_writes.py"
      - "scripts/validate_keyed_literals.py"
      - "scripts/validate_text_interactions.py"
      - "sand-core/tests/bounded_mutation_atomicity.rs"
      - "scripts/player_validation_harness.py"
      - "scripts/validate_player_participants.py"
      - "scripts/validate_player_joins.py"
      - "scripts/validate_detector_ownership.py"
      - "sand-core/tests/builtin_detector_ownership.rs"
      - "sand-core/tests/join_lifecycle_export.rs"
      - "scripts/tests/test_player_validation_harness.py"
      - "scripts/mc_validation/run_bounded_item_event_proof.py"
      - "sand-core/tests/event_chain_bounded_item_transport.rs"
      - "scripts/mc_validation/minimal_join_client.py"
      - "scripts/mc_validation/test_minimal_join_client.py"
      - "scripts/validate-vanilla-reload.sh"
      - "scripts/vanilla_reload_harness.py"
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

concurrency:
  group: vanilla-reload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve verified version and Java matrix
        id: matrix
        shell: bash
        run: |
          matrix=$(cargo run --quiet -p sand-version --bin vanilla-reload-matrix)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            matrix=$(jq -c '{include: [.include[] | select(.target == "latest")]}' <<< "$matrix")
          fi
          echo "value=$matrix" >> "$GITHUB_OUTPUT"

  validate:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Set up compiler object cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up Java ${{ matrix.java }} for Minecraft ${{ matrix.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache verified Minecraft data
        uses: actions/cache@v4
        with:
          path: ~/.sand/cache
          key: ${{ runner.os }}-sand-minecraft-${{ matrix.version }}
          restore-keys: |
            ${{ runner.os }}-sand-minecraft-

      - name: Prepare artifact directories
        run: mkdir -p "target/vanilla-reload/${{ matrix.version }}" sand-vanilla-audit/dist

      - name: Ensure SHA-verified server jar
        run: cargo run --quiet -p sand-build --bin ensure-server-jar -- "${{ matrix.version }}"

      - name: Build representative audit pack
        working-directory: sand-vanilla-audit
        env:
          SAND_MC_VERSION: ${{ matrix.version }}
          SAND_STRICT_CODEGEN: "1"
        run: cargo run --manifest-path ../sand-cli/Cargo.toml -- build

      - name: Validate initial load and reload
        run: |
          scripts/validate-vanilla-reload.sh \
            --version "${{ matrix.version }}" \
            --pack sand-vanilla-audit/dist/sand_audit \
            --output "target/vanilla-reload/${{ matrix.version }}"

      - name: Validate runtime world and block gameplay
        if: matrix.target == 'latest'
        run: |
          python3 scripts/validate_world_gameplay.py \
            --version "${{ matrix.version }}" \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --pack sand-vanilla-audit/dist/sand_audit \
            --output "target/vanilla-reload/${{ matrix.version }}/world-gameplay"

      - name: Validate real-player observation isolation and reload
        if: matrix.target == 'latest'
        run: |
          python3 scripts/validate_player_observations.py \
            --version "${{ matrix.version }}" \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --pack sand-vanilla-audit/dist/sand_audit \
            --output "target/vanilla-reload/${{ matrix.version }}/player-observations"

      - name: Validate typed text interaction codec round trips
        if: matrix.target == 'latest'
        run: |
          python3 scripts/validate_text_interactions.py \
            --version "${{ matrix.version }}" \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --pack sand-vanilla-audit/dist/sand_audit \
            --output "target/vanilla-reload/${{ matrix.version }}/text-interactions"

      - name: Build participant regression pack
        if: matrix.target == 'latest'
        working-directory: examples/participant_audit
        env:
          SAND_MC_VERSION: ${{ matrix.version }}
          SAND_STRICT_CODEGEN: "1"
        run: cargo run --manifest-path ../../sand-cli/Cargo.toml -- build

      - name: Validate real-player participants and equipment snapshots
        if: matrix.target == 'latest'
        run: |
          python3 scripts/validate_player_participants.py \
            --version "${{ matrix.version }}" \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --pack examples/participant_audit/dist/paudit \
            --output "target/vanilla-reload/${{ matrix.version }}/player-participants"

      - name: Validate real-player bounded item transport
        if: matrix.target == 'latest'
        run: |
          python3 scripts/mc_validation/run_bounded_item_event_proof.py \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --output "target/vanilla-reload/${{ matrix.version }}/bounded-items"

      - name: Validate real-player reconnect and datapack join isolation
        if: matrix.target == 'latest'
        run: |
          python3 scripts/validate_player_joins.py \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --output "target/vanilla-reload/${{ matrix.version }}/player-joins"

      - name: Validate guarded bounded State writes for real players
        if: matrix.target == 'latest'
        run: |
          python3 scripts/validate_bounded_state_writes.py \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --output "target/vanilla-reload/${{ matrix.version }}/bounded-state"
      - name: Validate built-in detector ownership in both tick orders
        if: matrix.target == 'latest'
        run: |
          python3 scripts/validate_detector_ownership.py \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --output "target/vanilla-reload/${{ matrix.version }}/detector-ownership"

      - name: Validate unified State example with real players and entities
        if: matrix.target == 'latest'
        run: |
          python3 scripts/mc_validation/run_unified_state_audit.py --build \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --evidence "target/vanilla-reload/${{ matrix.version }}/unified-state/evidence.json"

      - name: Validate literal keyed State values with real players and entities
        if: matrix.target == 'latest'
        run: |
          python3 scripts/validate_keyed_literals.py \
            --version "${{ matrix.version }}" \
            --pack examples/unified_state/dist/unified_state \
            --jar "$HOME/.sand/cache/${{ matrix.version }}/server.jar" \
            --output "target/vanilla-reload/${{ matrix.version }}/keyed-literals"

      - name: Validate dev to release world-build profile switching
        if: matrix.target == 'latest'
        run: |
          python3 scripts/validate_worldbuild_profiles.py \
            --output "target/vanilla-reload/${{ matrix.version }}/worldbuild-profiles"

      - name: Measure real-server MSPT and chunk generation
        if: matrix.target == 'latest' && github.event_name != 'pull_request'
        run: |
          python3 scripts/bench_runtime.py 1 \
            --output "target/vanilla-reload/${{ matrix.version }}/bench-runtime"

      - name: Write validation summary
        if: success()
        run: |
          echo "### Minecraft ${{ matrix.version }} / Java ${{ matrix.java }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Initial load, reload, clean shutdown, and configured world-build checks passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-reload-${{ matrix.target }}-${{ matrix.version }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/vanilla-reload/${{ matrix.version }}/latest.log
            target/vanilla-reload/${{ matrix.version }}/world-gameplay
            target/vanilla-reload/${{ matrix.version }}/player-observations
            target/vanilla-reload/${{ matrix.version }}/player-participants
            target/vanilla-reload/${{ matrix.version }}/bounded-items
            target/vanilla-reload/${{ matrix.version }}/player-joins
            target/vanilla-reload/${{ matrix.version }}/bounded-state
            target/vanilla-reload/${{ matrix.version }}/detector-ownership
            target/vanilla-reload/${{ matrix.version }}/unified-state
            target/vanilla-reload/${{ matrix.version }}/keyed-literals
            target/vanilla-reload/${{ matrix.version }}/text-interactions
            target/vanilla-reload/${{ matrix.version }}/worldbuild-profiles
            target/vanilla-reload/${{ matrix.version }}/bench-runtime
            sand-vanilla-audit/dist/sand_audit
            examples/participant_audit/dist/paudit
