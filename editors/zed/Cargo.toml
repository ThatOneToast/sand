[package]
name = "zed-sand"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Zed extension for the Sand datapack language"

# Built by Zed as a WebAssembly component; not part of the Sand workspace.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7.0"
