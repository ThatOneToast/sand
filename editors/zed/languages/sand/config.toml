name = "Sand"
grammar = "sand"
path_suffixes = ["sand"]
line_comments = ["// ", "/// ", "//! "]
block_comment = ["/* ", " */"]
tab_size = 4
autoclose_before = ";:.,=}])"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["_"]
