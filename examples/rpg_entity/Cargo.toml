[package]
name = "rpg_entity"
description = "Runnable entity-state, archetype, curve, and native-property example"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.0"
publish = false

[workspace]

[[bin]]
name = "sand_export"
path = "src/bin/sand_export.rs"
doc = false

[dependencies]
sand = { path = "../../sand" }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sand-build = { path = "../../sand-build" }
