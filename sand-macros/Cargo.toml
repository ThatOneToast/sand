[package]
name = "sand-macros"
description = "Procedural macros for the Sand Minecraft datapack toolkit: #[function], #[datapack_component], and run_fn!"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["minecraft", "datapack", "proc-macro", "macros"]
categories = ["game-development", "development-tools::procedural-macro-helpers"]

[features]
# Enables the hud_bar!, hud_element!, and texture! resource pack macros.
# The user's crate must also depend on sand-resourcepack directly.
resourcepack = []

[lib]
proc-macro = true

[dependencies]
sand-api-contract = { path = "../sand-api-contract", features = ["syntax"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["fold", "full", "visit"] }

[dev-dependencies]
trybuild = { version = "1", features = ["diff"] }
sand = { path = "../sand" }
sand-core = { path = "../sand-core" }
sand-macros = { path = "." }
inventory = "0.3"
