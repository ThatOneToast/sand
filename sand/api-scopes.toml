# Intentional migration boundaries for the public `sand` facade.
#
# This file contains scopes, never individual API exemptions. Source scopes
# are discovered through the reachable re-export graph. Generator scopes are
# supplied from the same declaration/schema that emits their Rust API.
schema_version = 1
enforced_scope_baseline = ["predicate-source", "generated-predicate-id-wrapper", "execute-when-source", "condition-source", "resource-ref-source", "generated-resource-id-wrappers", "version-source", "generated-vanilla-registries", "vfx-source", "advanced-source", "root-source", "generated-effect-registry-enums", "generated-commands", "generated-event-markers", "generated-registry-id-wrappers", "item-source", "inventory-source", "event-source", "events-source", "entity-source", "state-source", "participant-source", "text-source", "data-source", "systems-source", "command-source", "component-source", "resourcepack-source"]
pending_scope_ceiling = 0

[[scope]]
id = "root-source"
canonical_module = "sand"
state = "enforced"
tier = "ordinary"
provider = "source"
precedence = 100
recursive = false
aliases = ["sand::prelude"]

[[scope]]
id = "command-source"
canonical_module = "sand::command"
state = "enforced"
tier = "ordinary"
provider = "source"
aliases = ["sand::cmd", "sand::prelude"]

