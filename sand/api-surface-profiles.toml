# Expose the existing EntityScoreValue return type and its two methods (+3 source items).
# Forward progression branches and effective stack-capacity predicates add three contracted methods (including partial transfers).
# Exact aggregate ratchets for the generated-provider versions verified by CI.
# Selection uses the resolved `minecraft_version` embedded in both provider
# catalogs, never an environment-variable guess. Adding a version requires a
# separately reviewed deterministic baseline.
# Runtime world/block capabilities add thirteen items in world-source;
# typed gamerule settings add two items in build-source;
# canonical Target dimension scoping adds one command item. All scopes remain enforced.
# Text interactions consolidate hover_entity_with_id into hover_entity (-1 source method).
# RuntimeReport, CompiledPack.runtime_report, and final-resource reanalysis add three advanced-source items.
# Portable ScoreField.bounds adds one contracted advanced-source field.
# Portable flows add four definitions, thirteen fields and three hook phases (+20).
# Typed placement modifiers add one enum, eight variants, six payload fields;
# grouped inventory slot matching adds one method (+16 enforced source items).
# Typed biome spawn costs and replacement raw table setters add four source items.
# Shared generators add twelve source items and NoiseSettingsId adds four generated items.
# DimensionType dragon-fight configuration adds one enforced component method.
# Registered block raycasting adds 14 enforced source items (two modules, one type, eleven methods).
# Shared sound definitions and the instrument/song facade add three types and fifteen methods (+18 enforced source items).
# Player context calls replace the redundant Event::subject alias (net zero source items).
# Native biome ambient audio replaces four ignored effects setters with three types and eight methods (+7 source items).
# Typed living damage/effect mutations add two enforced source methods.
# Named entity equipment accessors add six enforced entity-source methods.
# Owned gameplay adds six types and 43 systems methods; canonical enum transitions
# and squared-distance curves add two entity methods (+51 enforced source items).
# Scenes, transforms, bounded jobs and vector expressions add 20 source items
# (three types and seventeen methods), all covered by API contracts.
# Owned sequences and reusable hit volumes add twelve contracted source items:
# two types, nine methods, and one TargetExecution method.
# Parent-owned tasks, joins, condition waits and bounded first-hit queries add
# six contracted methods (including one TargetExecution trait method).
# Combat and Encounter add two types and fifteen systems methods; scoped native
# damage attribution adds one entity method (+18 enforced source items).
# Menus, owned interactables, purchases and typed books add 25 contracted source items.
# Pack-local resources and synchronous ability policies add 12 source items.
# Pagination and object-bound menu registration add two systems methods.
# Conversation routing, inventory transfers, progression/session policies and
# scene/HUD presentation add 30 contracted source items.
# Checkpoint/Journal policies add 15 systems items; RuntimeAdvice and report
# guidance add two advanced items (+47 source items in this increment).
# Bounded Roster adds one type and nine contracted systems methods (+10).
