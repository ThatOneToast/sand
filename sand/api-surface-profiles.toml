# Exact aggregate ratchets for the generated-provider versions verified by CI.
# Selection uses the resolved `minecraft_version` embedded in both provider
# catalogs, never an environment-variable guess. Adding a version requires a
# separately reviewed deterministic baseline.
# Runtime world/block capabilities add thirteen items in world-source;
# typed gamerule settings add two items in build-source;
# canonical Target dimension scoping adds one command item. All scopes remain enforced.
# Text interactions consolidate hover_entity_with_id into hover_entity (-1 source method).
# RuntimeReport, CompiledPack.runtime_report, and final-resource reanalysis add three advanced-source items.
# Portable ScoreField.bounds adds one contracted advanced-source field.
# Portable flows add four definitions, thirteen fields and three hook phases (+20).
# Typed placement modifiers add one enum, eight variants, six payload fields;
# grouped inventory slot matching adds one method (+16 enforced source items).
# Typed biome spawn costs and replacement raw table setters add four source items.
# Shared generators add twelve source items and NoiseSettingsId adds four generated items.
# DimensionType dragon-fight configuration adds one enforced component method.
# Registered block raycasting adds 14 enforced source items (two modules, one type, eleven methods).
# Shared sound definitions and the instrument/song facade add three types and fifteen methods (+18 enforced source items).
schema_version = 1

# Explicit source-only profile used solely when sand-core code generation has
# failed and SAND_ALLOW_PLACEHOLDER_CODEGEN=1 was requested. Empty provider
# catalogs carry a machine-validated placeholder marker; real catalogs cannot
# select this ratchet.
[[profile]]
minecraft_version = "placeholder-codegen"
static_surface_items = 5036
pending_item_ceiling = 0
baseline = "api-surface-baseline-placeholder.txt"

[[profile]]
minecraft_version = "26.2"
static_surface_items = 11136
pending_item_ceiling = 0
baseline = "api-surface-baseline.txt"
